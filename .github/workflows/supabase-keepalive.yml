name: Supabase 保活

# 免费版 Supabase 项目连续 7 天没有任何访问就会被自动暂停，
# 本任务每天定时访问一次数据库，避免被暂停。
#
# 触发方式：
#   ① 每天定时（见下面 cron）
#   ② 手动：仓库 → Actions → 选本任务 → Run workflow
on:
  schedule:
    # cron 是 UTC 时间。下面两行 = 北京时间 09:05 和 21:05 各跑一次
    # （一天两次更保险：GitHub 的定时任务偶尔会延迟或跳过，双保险）
    - cron: '5 1 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动点一次，方便刚配好时验证

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 访问一次 Supabase（不取数据，只要它响应）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::未配置 SUPABASE_URL / SUPABASE_ANON_KEY 两个 Secret"
            exit 1
          fi

          echo "正在访问 $SUPABASE_URL ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --max-time 30)

          echo "HTTP 状态码: $code"
          if [ "$code" = "200" ] || [ "$code" = "206" ]; then
            echo "✅ 保活成功"
          else
            echo "::warning::状态码不是 200，请检查 URL 与 anon key 是否正确（注意不要填错成 service_role）"
            exit 1
          fi
